<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Dashboard IA para Devs</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1 style="text-align:center;">📊 Dashboard IA para Devs</h1>

<div class="cards-dashboard">

<div class="card-dashboard">
<h2 id="participantes">0</h2>
<p>Participantes</p>
</div>

<div class="card-dashboard">
<h2 id="mediaNota">0</h2>
<p>Nota Média</p>
</div>

<div class="card-dashboard">
<h2 id="mediaAvaliacao">0</h2>
<p>Avaliação Média</p>
</div>

<div class="card-dashboard">
<h2 id="porcentagemIA">0%</h2>
<p>Já utilizava IA</p>
</div>

</div>

<canvas id="graficoCursos"></canvas>

<br>

<canvas id="graficoNotas"></canvas>

<script src="dashboard.js"></script>

</body>

</html>
